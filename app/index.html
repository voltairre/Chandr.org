<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>
        <title>Chandr</title>
        <link rel="icon" href="favicon.png">
        <style>
html, body {
    background-image: url("background.webp");
    padding: 0;
    margin: 0;
    overflow: hidden;
    height: 100%;
}
#screen {width: 100%; height: 100%;}
#qtspinner {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0;
}
        </style>
    </head>
    <body onload="init()">
        <figure style="overflow:visible;" id="qtspinner">
            <img src="ouroboros.svg" width="300" style="display:block; animation:spin 5s linear infinite"><style>@keyframes spin{to{transform:rotate(360deg)}}</style>
            <div id="qtstatus"></div>
            <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
        </figure>
        <div id="screen"></div>

        <script type="text/javascript">
            async function init()
            {
                const spinner = document.querySelector('#qtspinner');
                const screen = document.querySelector('#screen');
                const status = document.querySelector('#qtstatus');

                const showUi = (ui) => {
                    [spinner, screen].forEach(element => element.style.display = 'none');
                    if (screen === ui)
                        screen.style.position = 'default';
                    ui.style.display = 'flex';
                }

                try {
                    showUi(spinner);
                    const instance = await qtLoad({
                        qt: {
                            onLoaded: () => showUi(screen),
                            onExit: exitData =>
                            {
                                status.innerHTML = 'Application exit';
                                status.innerHTML +=
                                    exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                                status.innerHTML +=
                                    exitData.text !== undefined ? ` (${exitData.text})` : '';
                                showUi(spinner);
                            },
                            entryFunction: window.website_entry,
                            containerElements: [screen],

                        }
                    });
                } catch (e) {
                    console.error(e);
                    console.error(e.stack);
                }
            }
        </script>
        <script src="website.js"></script>
        <script type="text/javascript" src="qtloader.js"></script>
    </body>
</html>

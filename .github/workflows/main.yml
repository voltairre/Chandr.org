on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_multithread'

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.7'

      - run: qt-cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: brotli -5 build/main.wasm -o app/main.wasm
      - run: cp build/{qtloader.js,main.js} app

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app --project-name=chandr
